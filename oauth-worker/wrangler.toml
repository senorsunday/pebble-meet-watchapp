name = "pebble-meet-watchapp-oauth"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
CONFIG_PAGE_URL = "https://senorsunday.github.io/pebble-meet-watchapp/config/"
ALLOWED_ORIGINS = "https://senorsunday.github.io"
# Optional: set OAUTH_EXTRA_SCOPES (space-separated) on a verified custom-domain deployment
# e.g. "https://www.googleapis.com/auth/calendar.events.readonly"

[[durable_objects.bindings]]
name = "BRIDGE_ROOM"
class_name = "BridgeRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BridgeRoom"]

# Optional secrets (only needed if you enable self-hosted Google OAuth):
#   npx wrangler secret put GOOGLE_CLIENT_ID
#   npx wrangler secret put GOOGLE_CLIENT_SECRET
#   npx wrangler secret put STATE_SIGNING_SECRET
