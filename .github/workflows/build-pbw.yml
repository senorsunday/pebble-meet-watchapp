name: Build & Release Pebble .pbw & Companions

on:
  push:
    branches: [main, 'feat/*']
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pbw:
    runs-on: ubuntu-latest
    container:
      image: rebble/pebble-sdk:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate JSON manifests & JS syntax
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('chrome-bridge/manifest.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('firefox-bridge/manifest.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('appstore/store-listing.json','utf8'))"
          node --check src/pkjs/index.js
          node --check chrome-bridge/background.js
          node --check chrome-bridge/content.js
          node --check chrome-bridge/popup.js
          node --check firefox-bridge/background.js
          node --check firefox-bridge/content.js
          node --check firefox-bridge/popup.js

      - name: Install PebbleKit JS dependencies
        run: npm install --no-audit --no-fund

      - name: Compile Pebble watchapp (.pbw)
        run: |
          if [ -d /root/.pebble-sdk ] && [ ! -e "$HOME/.pebble-sdk" ]; then
            ln -s /root/.pebble-sdk "$HOME/.pebble-sdk"
          fi
          mkdir -p "$HOME/.pebble-sdk"
          touch "$HOME/.pebble-sdk/NO_TRACKING"
          if [ ! -e "$HOME/.pebble-sdk/SDKs/current" ]; then
            yes | pebble sdk install latest
          fi
          pebble build

      - name: Verify & version .pbw output
        run: |
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          PBW_FILE=$(ls build/*.pbw | head -n 1)
          ls -lh "$PBW_FILE"
          cp "$PBW_FILE" "build/pebble-meet-watchapp-v${VERSION}.pbw"

      - name: Upload compiled .pbw artifact
        uses: actions/upload-artifact@v7
        with:
          name: pebble-meet-watchapp-pbw
          path: build/*.pbw

  build-companions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Test & build Android Companion APK
        working-directory: android-companion
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug

      - name: Package companion release artifacts
        run: |
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          mkdir -p dist
          cp android-companion/app/build/outputs/apk/debug/app-debug.apk "dist/pebble-meet-android-companion-v${VERSION}.apk"
          (cd chrome-bridge && zip -r "../dist/pebble-meet-chrome-bridge-v${VERSION}.zip" .)
          (cd firefox-bridge && zip -r "../dist/pebble-meet-firefox-bridge-v${VERSION}.zip" .)
          ls -lh dist/

      - name: Upload companion artifacts (Android APK + Chrome/Firefox bridges)
        uses: actions/upload-artifact@v7
        with:
          name: pebble-meet-companions
          path: dist/*

  release:
    needs: [build-pbw, build-companions]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download .pbw artifact
        uses: actions/download-artifact@v4
        with:
          name: pebble-meet-watchapp-pbw
          path: release-files

      - name: Download companion artifacts
        uses: actions/download-artifact@v4
        with:
          name: pebble-meet-companions
          path: release-files

      - name: Publish GitHub Release on version tag
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-files/*
            appstore/icon-48.png
            appstore/icon-144.png
            appstore/banner-720x320.png
          generate_release_notes: true
