name: Build & Release Pebble .pbw

on:
  push:
    branches: [main, 'feat/*']
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pbw:
    runs-on: ubuntu-latest
    container:
      image: rebble/pebble-sdk:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate JSON manifests & JS syntax
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('chrome-bridge/manifest.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('appstore/store-listing.json','utf8'))"
          node --check src/pkjs/index.js
          node --check chrome-bridge/background.js
          node --check chrome-bridge/content.js
          node --check chrome-bridge/popup.js

      - name: Install PebbleKit JS dependencies
        run: npm install --no-audit --no-fund

      - name: Compile Pebble watchapp (.pbw)
        run: |
          if [ -d /root/.pebble-sdk ] && [ ! -e "$HOME/.pebble-sdk" ]; then
            ln -s /root/.pebble-sdk "$HOME/.pebble-sdk"
          fi
          mkdir -p "$HOME/.pebble-sdk"
          touch "$HOME/.pebble-sdk/NO_TRACKING"
          if [ ! -e "$HOME/.pebble-sdk/SDKs/current" ]; then
            yes | pebble sdk install latest
          fi
          pebble build

      - name: Verify & version .pbw output
        run: |
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          PBW_FILE=$(ls build/*.pbw | head -n 1)
          ls -lh "$PBW_FILE"
          cp "$PBW_FILE" "build/pebble-meet-watchapp-v${VERSION}.pbw"

      - name: Upload compiled .pbw artifact
        uses: actions/upload-artifact@v7
        with:
          name: pebble-meet-watchapp-pbw
          path: build/*.pbw

      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/*.pbw
            appstore/icon-48.png
            appstore/icon-144.png
            appstore/banner-720x320.png
          generate_release_notes: true
